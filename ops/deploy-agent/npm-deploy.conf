# Loaded by Nginx Proxy Manager from /data/nginx/custom/http.conf.
limit_req_zone $binary_remote_addr zone=deploy_webhook:10m rate=10r/m;

server {
  listen 80;
  listen [::]:80;
  server_name deploy.trisbom.com;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name deploy.trisbom.com;

  ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;
  include conf.d/include/ssl-ciphers.conf;

  access_log /data/logs/deploy-agent_access.log proxy;
  error_log /data/logs/deploy-agent_error.log warn;
  client_max_body_size 40k;

  location = /health {
    proxy_pass http://deploy-agent:8080/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /deploy {
    limit_req zone=deploy_webhook burst=5 nodelay;
    proxy_pass http://deploy-agent:8080/deploy;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    return 404;
  }
}
