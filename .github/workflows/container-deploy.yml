name: Build and deploy container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: degiro-portfolio-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/tristanbomans/degiro-portfolio

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read application version
        id: package
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE }}:sha-${{ github.sha }}
            ${{ env.IMAGE }}:${{ steps.package.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}

      - name: Deploy through the allowlisted worker
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          timestamp=$(date +%s)
          delivery=$(cat /proc/sys/kernel/random/uuid)
          body=$(jq -cn \
            --arg project "degiro-portfolio" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg commit "${GITHUB_SHA}" \
            '{project:$project,repository:$repository,commit:$commit}')
          signature=$(printf '%s.%s' "$timestamp" "$body" | openssl dgst -sha256 -hmac "$DEPLOY_SECRET" -hex | awk '{print $2}')
          curl --fail-with-body --silent --show-error \
            --request POST https://deploy.trisbom.com/deploy \
            --header "Content-Type: application/json" \
            --header "X-Deploy-Timestamp: $timestamp" \
            --header "X-Deploy-Signature: sha256=$signature" \
            --header "X-Deploy-Delivery: $delivery" \
            --header "X-Registry-Username: ${GITHUB_REPOSITORY_OWNER}" \
            --header "X-Registry-Token: $REGISTRY_TOKEN" \
            --data "$body"
